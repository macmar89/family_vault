services:
  db:
    image: postgres:17-alpine
    container_name: family_vault_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: family_vault_dev
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: family_vault_api
    depends_on:
      - db
    ports:
      - '5300:5300'
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      DATABASE_URL: 'postgresql://admin:password123@db:5433/family_vault_dev?schema=public'
      PORT: 5300
    restart: always

volumes:
  postgres_data:
